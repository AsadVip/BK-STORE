[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "all, index, follow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all, index, follow"
    Access-Control-Allow-Origin = "*"
