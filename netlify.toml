[build]
  command = "npm run build"
  publish = "dist"

# --- Static SEO files ko pehle serve karo (catch-all se pehle) ---
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/google08a651d6ae307e3c.html"
  to = "/google08a651d6ae307e3c.html"
  status = 200

# --- SPA Catch-all (ye LAST mein hona chahiye) ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Headers ---
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Robots-Tag = "all, index, follow"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "all, index, follow"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all, index, follow"
    # --- Security Headers ---
    # Force HTTPS for 1 year (includeSubDomains + preload ready)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Prevent clickjacking — no iframe embedding allowed
    X-Frame-Options = "DENY"
    # Prevent MIME-type sniffing attacks
    X-Content-Type-Options = "nosniff"
    # Legacy XSS protection (for older browsers)
    X-XSS-Protection = "1; mode=block"
    # Control referrer information leakage
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable dangerous browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # DNS prefetch for performance
    X-DNS-Prefetch-Control = "on"
    # Content Security Policy — restrict all resource loading to trusted sources
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me;"
